services:
  meshpi:
    build: .
    image: meshpi-web:local
    container_name: meshpi
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env                      # MESHPI_USER / MESHPI_PASSWORD (not in git, chmod 600)
    environment:
      MESH_HOST: ${MESH_HOST:?set MESH_HOST in .env}   # Pi with the radio: mesh-proxy (multi-client) or meshtasticd; address lives in .env, not in git
      MESH_PORT: ${MESH_PORT:-4403}
    ports:
      - "${MESHPI_PUBLISH:-127.0.0.1}:8090:8080"   # MESHPI_PUBLISH in .env: the host's LAN address (default: this host only)
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
